name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aioffice
          POSTGRES_PASSWORD: aioffice_test_pw
          POSTGRES_DB: aioffice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8001:8000

    env:
      DATABASE_URL: postgresql://aioffice:aioffice_test_pw@localhost:5432/aioffice_test
      SECRET_KEY: test-secret-key-for-ci
      ANTHROPIC_API_KEY: test-key-not-real
      CHROMA_HOST: localhost
      CHROMA_PORT: "8001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aioffice-api ./backend
